services:
  claude-wrapper:
    image: and124578963/claude-wrapper:2026.05.10
    build: .
    # Service name "claude-wrapper" is what other containers on `ai-net`
    # resolve via Docker DNS, e.g. http://claude-wrapper:8000/v1/...
    container_name: claude-wrapper
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Bundled Claude CLI's auth lives at $HOME/.claude. The container runs
      # as user "wrapper" (uid 1000) — see Dockerfile — so the mount target
      # is /home/wrapper/.claude, not /root/.claude. The host-side ~/.claude
      # files must be readable by uid 1000.
      - ~/.claude:/home/wrapper/.claude
    environment:
      - PORT=8000
    networks:
      - ai-net

networks:
  ai-net:
    external: true
    name: ai-net
